[project]
name = "summarize-rl"
version = "0.1.0"
description = "PMI-weight RL for military-domain summarization: learn only the PMI combination weights [a,b,c,d] on a frozen LLM via reference-free SCST."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "accelerate>=1.14.0",
    "google-genai>=2.14.0",
    "nltk>=3.10.0",
    "tensorboard>=2.21.0",
    "torch>=2.1",
    "torchmetrics>=1.9.0",
    "transformers==5.1",
]

[project.optional-dependencies]
# Real backbone LLM (HFBackend). Not needed for the core library, MockBackend,
# or the unit tests.
hf = [
    "transformers>=4.40",
]
# TensorBoard logging for training runs (examples/*, --logdir). Optional; the
# trainers and tests run without it.
tb = [
    "tensorboard>=2.10",
]

[dependency-groups]
# Installed by default with `uv sync` (dev tooling for tests).
dev = [
    "pytest>=7",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summarize_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Install a CUDA 12.4 torch build (works with NVIDIA drivers supporting CUDA
# >= 12.4, incl. the 12.8 driver here). The default PyPI torch is built against a
# newer CUDA than that driver supports ("driver too old" RuntimeError), so pull
# torch from PyTorch's cu124 index instead.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
